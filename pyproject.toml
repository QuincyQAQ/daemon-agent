[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bear-harness"
version = "0.1.0"
description = "Local, auditable agent runtime with evolving skills and MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ui = ["rich>=13.7,<16"]
models = ["openai>=1.30,<3", "anthropic>=0.40,<1"]

[project.scripts]
bear = "agents.main:main"

[tool.setuptools.packages.find]
include = ["agents*"]
