name: Foldjay Agent checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: ./scripts/check.sh
      - run: python -m pip install .
      - name: Run installed CLI outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          foldjay demo > demo.json
          python -c "import json; r=json.load(open('demo.json')); assert r['resumed'] and r['file_content']=='Verified Foldjay\n'"

  model-sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install '.[models,ui]'
      - run: python -m unittest tests.test_sdk_transport tests.test_terminal -v

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build --target core -t foldjay-agent:test .
      - run: docker run --rm foldjay-agent:test demo
      - name: Check live image dependencies
        run: |
          docker build --target live -t foldjay-agent:live .
          docker run --rm --entrypoint python foldjay-agent:live -c 'import openai, anthropic'
      - name: Run Compose with a fresh writable workspace
        run: |
          export FOLDJAY_WORKSPACE="$(mktemp -d)" FOLDJAY_UID="$(id -u)" FOLDJAY_GID="$(id -g)"
          docker compose run --build --rm -T foldjay demo
          test -s "$FOLDJAY_WORKSPACE/.foldjay/demo/latest-report.json"
